version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    env_file: .env
    depends_on:
      - mysql
    networks:
      - saas-network

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8890:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - saas-network

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3390:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pos_kasir}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}


    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - saas-network

volumes:
  mysql-data:

networks:
  saas-network:
    driver: bridge
